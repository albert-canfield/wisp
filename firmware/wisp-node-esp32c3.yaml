# Wisp node for ESP32-C3 boards. No status LED: its pin differs between boards.

esphome:
  build_path: .esphome/build/wisp-esp32c3 # one build folder per chip

packages:
  base: !include common/base.yaml

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

dashboard_import:
  package_import_url: github://albert-canfield/wisp/firmware/wisp-node-esp32c3.yaml@main
  import_full_config: false
