# Wisp node for ESP32-C3 boards.
# Built from this repository (development, CI and releases). The ESPHome dashboard adopts nodes
# with import/wisp-node-esp32c3.yaml instead, which takes the Wisp component from GitHub.

esphome:
  build_path: build/wisp-esp32c3 # one build folder per chip

packages:
  base: !include common/base.yaml
  board: !include common/board-esp32c3.yaml

external_components:
  - source:
      type: local
      path: components

dashboard_import:
  package_import_url: github://albert-canfield/wisp/firmware/import/wisp-node-esp32c3.yaml@main
  import_full_config: false
