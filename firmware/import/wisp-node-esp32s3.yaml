# Wisp node for ESP32-S3 boards. Tested on ESP32-S3 N16R8 DevKitC boards.
# For the ESPHome dashboard ("Adopt"): the same node as ../wisp-node-esp32s3.yaml, with the Wisp
# component taken from GitHub, since the adopting machine has no copy of this repository.

packages:
  base: !include ../common/base.yaml
  board: !include ../common/board-esp32s3.yaml

external_components:
  - source:
      type: git
      url: https://github.com/albert-canfield/wisp
      ref: main
      path: firmware/components
    components: [wisp]
    refresh: 1d
