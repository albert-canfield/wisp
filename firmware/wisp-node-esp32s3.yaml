# Wisp node for ESP32-S3 boards. Tested on ESP32-S3 N16R8 DevKitC boards.
# Built from this repository (development, CI and releases). The ESPHome dashboard adopts nodes
# with import/wisp-node-esp32s3.yaml instead, which takes the Wisp component from GitHub.

esphome:
  build_path: build/wisp-esp32s3 # one build folder per chip

packages:
  base: !include common/base.yaml
  board: !include common/board-esp32s3.yaml

external_components:
  - source:
      type: local
      path: components

dashboard_import:
  package_import_url: github://albert-canfield/wisp/firmware/import/wisp-node-esp32s3.yaml@main
  import_full_config: false
