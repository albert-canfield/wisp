# Wisp node for ESP32-S3 boards. Tested on an ESP32-S3 N16R8 DevKitC board.
# Generic build: 4 MB layout and no PSRAM, so it runs on every S3 board.
# Boards with two USB ports: logs and Improv use the native port (often labelled USB).
# The COM/UART port can flash the board but stays silent afterwards.

packages:
  base: !include common/base.yaml
  status_led: !include common/status_led_rgb.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

dashboard_import:
  package_import_url: github://albert-canfield/wisp/firmware/wisp-node-esp32s3.yaml@main
  import_full_config: false
