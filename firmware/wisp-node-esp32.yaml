# Wisp node for original ESP32 boards (ESP32-WROOM, DevKit V1 and similar).
# Built from this repository (development, CI and releases). The ESPHome dashboard adopts nodes
# with import/wisp-node-esp32.yaml instead, which takes the Wisp component from GitHub.

esphome:
  build_path: build/wisp-esp32 # one build folder per chip

packages:
  base: !include common/base.yaml
  board: !include common/board-esp32.yaml

external_components:
  - source:
      type: local
      path: components

dashboard_import:
  package_import_url: github://albert-canfield/wisp/firmware/import/wisp-node-esp32.yaml@main
  import_full_config: false
