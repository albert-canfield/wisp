# Wisp node: ESPHome base shared by every chip. Wisp's core is the `wisp` external component.

substitutions:
  name: wisp
  friendly_name: Wisp
  project_version: "0.1.8"
  motion_threshold: "2.0" # default; then the Motion threshold entity, kept across reboots

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.9.0
  project:
    name: albert-canfield.wisp-node
    version: ${project_version}

wisp:
  id: wisp_node
  ap_ping_interval: 50ms # pings to the gateway: each reply from the AP carries CSI
  raw_stream_port: 47010 # UDP: subscriptions in, raw CSI and link reports out
  report_interval: 200ms # link reports to subscribers (Home Assistant)
  grid_channel: 0 # 0 = automatic: channel of the lowest BSSID of this network heard at ap_min_rssi
  ap_min_rssi: -80
  ap_csi_rate:
    name: AP CSI rate
  csi_dropped:
    name: CSI dropped
  motion_threshold: ${motion_threshold} # score at which a link reports motion (1 = as quiet as usual)
  max_link_threshold: # noisy links raise their own threshold above it, from their quiet scores
    name: Highest link threshold
    disabled_by_default: true
  ap_motion_score:
    name: AP motion score
    filters:
      - or: # report big changes at once, otherwise every 10 s
          - delta: 0.3
          - throttle: 10s
  ap_motion:
    name: AP motion
  motion: # on while the hive confirms motion on one of this node's links: both ways and a third node
    name: Motion
  grid_nodes:
    name: Grid nodes
  channel:
    name: Grid channel
  hive_in_sync:
    name: Hive in sync
  core_stack_free:
    name: Core stack free
    disabled_by_default: true
  breathing: # on while a link shows someone breathing; needs the Breathing detection switch
    name: Breathing
    disabled_by_default: true
  breathing_rate:
    name: Breathing rate
    disabled_by_default: true

logger:

# Nodes wait out a missing Home Assistant or WiFi and recover by themselves: never reboot for it.
api:
  reboot_timeout: 0s

wifi:
  power_save_mode: none # power save breaks CSI timing and ESP-NOW reception
  post_connect_roaming: false # Wisp picks the access point itself: all nodes on one channel
  reboot_timeout: 0s
  ap: {} # fallback hotspot named after the node

captive_portal:

improv_serial:

web_server:
  version: 3

safe_mode:

ota:
  - platform: esphome
  - platform: http_request

http_request:

update:
  - platform: http_request
    name: Firmware
    source: https://albert-canfield.github.io/wisp/manifest.json
    update_interval: 6h

debug:
  update_interval: 60s

number:
  - platform: template
    name: Fixed grid channel # 0 = automatic: the channel of the lowest BSSID of this network
    icon: mdi:wifi-cog
    entity_category: config
    min_value: 0
    max_value: 13
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      - lambda: id(wisp_node).set_grid_channel(static_cast<uint8_t>(x));
  - platform: template
    name: Motion threshold
    icon: mdi:tune-vertical
    entity_category: config
    min_value: 1.2
    max_value: 6
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: ${motion_threshold}
    on_value:
      - lambda: id(wisp_node).set_motion_threshold(x);

switch:
  - platform: template
    name: Raw CSI stream
    icon: mdi:waveform
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(wisp_node).set_raw_stream_enabled(true);
    on_turn_off:
      - lambda: id(wisp_node).set_raw_stream_enabled(false);
  - platform: template
    name: Breathing detection # experimental: someone sitting still, from their breathing; about 7 KB of RAM
    icon: mdi:lungs
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(wisp_node).set_breathing_enabled(true);
    on_turn_off:
      - lambda: id(wisp_node).set_breathing_enabled(false);

button:
  - platform: restart
    name: Restart
  - platform: safe_mode
    name: Safe mode
  - platform: factory_reset
    name: Factory reset

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: debug
    free:
      name: Free memory
    block:
      name: Heap max block
      disabled_by_default: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP address
    ssid:
      name: WiFi network
    bssid:
      name: Access point
    mac_address:
      name: MAC address
  - platform: debug
    reset_reason:
      name: Reset reason
