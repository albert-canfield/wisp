# Wisp node: ESPHome base shared by every chip. Wisp's core is the `wisp` external component.

substitutions:
  name: wisp
  friendly_name: Wisp
  project_version: "0.1.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.9.0
  project:
    name: albert-canfield.wisp-node
    version: ${project_version}

wisp:
  id: wisp_node
  ap_ping_interval: 50ms # pings to the gateway: each reply from the AP carries CSI
  raw_stream_port: 47010 # UDP: subscriptions in, raw CSI and link reports out
  report_interval: 200ms # link reports to subscribers (Home Assistant)
  grid_channel: 0 # 0 = automatic: channel of the lowest BSSID of this network heard at ap_min_rssi
  ap_min_rssi: -80
  ap_csi_rate:
    name: AP CSI rate
  csi_dropped:
    name: CSI dropped
  motion_threshold: 2.0 # score at which AP motion turns on (1 = as quiet as usual)
  ap_motion_score:
    name: AP motion score
    filters:
      - or: # report big changes at once, otherwise every 10 s
          - delta: 0.3
          - throttle: 10s
  ap_motion:
    name: AP motion
  grid_nodes:
    name: Grid nodes
  channel:
    name: Grid channel
  hive_in_sync:
    name: Hive in sync

logger:

# Nodes keep sensing without Home Assistant or WiFi, so never reboot for a missing connection.
api:
  reboot_timeout: 0s

wifi:
  power_save_mode: none # power save breaks CSI timing and ESP-NOW reception
  post_connect_roaming: false # Wisp picks the access point itself: all nodes on one channel
  reboot_timeout: 0s
  ap: {} # fallback hotspot named after the node

captive_portal:

improv_serial:

web_server:
  version: 3

safe_mode:

ota:
  - platform: esphome
  - platform: http_request

http_request:

update:
  - platform: http_request
    name: Firmware
    source: https://albert-canfield.github.io/wisp/manifest.json
    update_interval: 6h

debug:
  update_interval: 60s

switch:
  - platform: template
    name: Raw CSI stream
    icon: mdi:waveform
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(wisp_node).set_raw_stream_enabled(true);
    on_turn_off:
      - lambda: id(wisp_node).set_raw_stream_enabled(false);

button:
  - platform: restart
    name: Restart
  - platform: safe_mode
    name: Safe mode
  - platform: factory_reset
    name: Factory reset

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: debug
    free:
      name: Free memory

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP address
    ssid:
      name: WiFi network
    bssid:
      name: Access point
    mac_address:
      name: MAC address
  - platform: debug
    reset_reason:
      name: Reset reason
