# Single WS2812 RGB LED: off when all is well, amber without WiFi,
# blue without Home Assistant, white strobe while identifying.

substitutions:
  status_led_pin: GPIO48

globals:
  - id: led_mode
    type: int
    initial_value: "-1"
  - id: identify_until
    type: uint32_t
    initial_value: "0"

light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    internal: true
    pin: ${status_led_pin}
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
    effects:
      - strobe:
          name: Identify
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 100%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 150ms

button:
  - platform: template
    name: Identify
    icon: mdi:led-on
    on_press:
      - lambda: |-
          id(identify_until) = millis() + 10000;
          id(led_mode) = -1;
      - light.turn_on:
          id: status_rgb
          effect: Identify

interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (millis() < id(identify_until)) return;
          int mode = 0;
          if (!wifi::global_wifi_component->is_connected()) mode = 1;
          else if (!api::global_api_server->is_connected()) mode = 2;
          if (mode == id(led_mode)) return;
          id(led_mode) = mode;
          auto call = mode == 0 ? id(status_rgb).turn_off() : id(status_rgb).turn_on();
          if (mode == 1) call.set_rgb(1.0f, 0.45f, 0.0f);
          if (mode == 2) call.set_rgb(0.0f, 0.2f, 1.0f);
          if (mode != 0) call.set_brightness(0.3f);
          call.set_effect("None");
          call.perform();
